name: Cek drift halaman kos

on:
  pull_request:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bandingkan halaman /kos/ dengan data API
        id: cek
        continue-on-error: true
        run: node scripts/kos-pages.mjs --check --summary drift.md
      - name: Buka atau perbarui issue drift
        if: steps.cek.outcome == 'failure' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create harga-basi --color FBCA04 --description "Halaman kos tidak sama dengan data API" 2>/dev/null || true
          NOMOR=$(gh issue list --label harga-basi --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$NOMOR" ]; then
            gh issue edit "$NOMOR" --body-file drift.md
            gh issue comment "$NOMOR" --body "Diperiksa ulang $(date -u '+%Y-%m-%d %H:%M UTC')."
          else
            gh issue create --title "Harga basi: halaman /kos/ berbeda dari data API" --label harga-basi --body-file drift.md
          fi
      - name: Simpan ringkasan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift
          path: drift.md
          if-no-files-found: ignore
      - name: Gagalkan job bila ada drift
        if: steps.cek.outcome == 'failure'
        run: exit 1
