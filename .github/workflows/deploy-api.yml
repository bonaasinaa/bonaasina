# Deploy fungsi Supabase "api" otomatis setiap ada perubahan di supabase/functions/ yang masuk ke main.
# Butuh secret repo SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens), diisi sendiri oleh pemilik repo.
name: Deploy API Supabase

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/deploy-api.yml']
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ncjecdnbrtsshqbxvddb
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy fungsi api (index.ts + market.ts + docs.ts)
        run: supabase functions deploy api --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
