# Penjaga komentar antislop-code dan aturan UI (jarak kelipatan 4, berat font, ?v= aset, alt gambar, outline fokus).
name: Cek komentar & UI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  komentar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Jalankan penjaga komentar
        run: node scripts/check-comments.mjs --strict
      - name: Jalankan penjaga aturan UI
        run: node scripts/check-ui.mjs
