<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#F7EDE3">
  <title>Cek kartu & kuitansi — Bonaasina</title>
  <link rel="icon" href="/assets/img/icon-32.png" sizes="32x32">
  <link rel="stylesheet" href="/css/fonts.css?v=20261024a">
  <link rel="stylesheet" href="/admin/admin.css?v=20261024a">
  <style>
    .verify { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
    .verify__card { width: min(440px, 100%); background: var(--paper); border: 1px solid var(--line); border-radius: 28px; padding: clamp(24px, 6vw, 32px); display: grid; gap: 14px; text-align: center; justify-items: center; }
    .verify__card img.logo { width: 150px; height: auto; }
    .verify__card h1 { font-family: var(--serif); font-size: 1.8rem; line-height: 1.1; }
    .verify__badge { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-weight: 700; }
    .verify__badge.ok { background: var(--green-bg); color: var(--green); }
    .verify__badge.no { background: var(--red-bg); color: var(--red); }
    .verify__photo { width: 120px; aspect-ratio: 56 / 72; border-radius: 12px; overflow: hidden; background: var(--cream); border: 1px solid var(--line); }
    .verify__photo img { width: 100%; height: 100%; object-fit: cover; }
    .verify .kv { text-align: left; width: 100%; }
  </style>
</head>
<body>
  <main class="verify"><section class="verify__card" id="out" aria-live="polite">
    <img class="logo" src="/assets/img/logo-bonaasina.webp" alt="Bonaasina" width="220" height="194">
    <p class="muted">Memeriksa…</p>
  </section></main>
  <script src="/js/config.js?v=20261024a"></script>
  <script src="/cek/cek.js?v=20261029c" defer></script>
  <script src="/js/analytics.js?v=20261024a" defer></script>
</body>
</html>
