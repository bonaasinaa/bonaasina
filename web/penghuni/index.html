<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F7EDE3">
  <title>Dashboard Penghuni — Bonaasina</title>
  <link rel="icon" href="/assets/img/icon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/assets/img/icon-180.png">
  <link rel="stylesheet" href="/css/fonts.css?v=20261024a">
  <link rel="stylesheet" href="/admin/admin.css?v=20261024a">
  <link rel="stylesheet" href="/css/dash.css?v=20261024a">
</head>
<body class="tenant">
  <!-- Masuk -->
  <main class="login" id="login" hidden>
    <form class="login__card" id="loginForm">
      <img src="/assets/img/logo-bonaasina.webp" alt="Bonaasina" width="220" height="194">
      <h1>Dashboard penghuni</h1>
      <p class="muted small">Masuk dengan username dan kata sandi dari pengelola kos.</p>
      <label>Username
        <input type="text" name="username" id="loginUser" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label>Kata sandi
        <span class="pw-row"><input type="password" name="password" id="loginPass" autocomplete="current-password" required><button type="button" class="btn btn--ghost btn--sm" id="showPass" aria-pressed="false">Lihat</button></span>
      </label>
      <p class="err" id="loginErr" role="alert" hidden></p>
      <button class="btn btn--red btn--block" type="submit">Masuk</button>
      <p class="muted small">Lupa kata sandi? Minta pengelola mengatur ulang lewat WhatsApp.</p>
    </form>
  </main>

  <!-- Aplikasi -->
  <div class="app" id="app" hidden>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <header class="topbar">
      <button class="topbar__menu" id="menuBtn" type="button" aria-expanded="false" aria-controls="side" aria-label="Buka menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6Zm0 5h18v2H3v-2Zm0 5h18v2H3v-2Z"/></svg><span class="nav-dot" id="navDot" hidden></span>
      </button>
      <strong class="topbar__title" id="topTitle">Beranda</strong>
      <a class="topbar__brand" href="/" aria-label="Website Bonaasina"><img src="/assets/img/mark.webp" alt="" width="40" height="27"></a>
    </header>
    <div class="nav-scrim" id="navScrim" hidden></div>
    <aside class="side" id="side">
      <a class="side__brand" href="/" title="Website Bonaasina">
        <img src="/assets/img/mark.webp" alt="" width="44" height="30"><span>Bonaasina</span>
      </a>
      <p class="side__who" id="sideWho"></p>
      <nav class="side__nav" id="sideNav" aria-label="Menu penghuni">
        <a href="#beranda" data-view="beranda" data-bnav="Beranda"><svg viewBox="0 0 24 24"><path d="M12 3 2 11h3v10h5v-6h4v6h5V11h3L12 3Z"/></svg>Beranda</a>
        <a href="#tagihan" data-view="tagihan" data-bnav="Tagihan"><svg viewBox="0 0 24 24"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2Zm3 5v2h6V7H9Zm0 4v2h6v-2H9Z"/></svg>Tagihan &amp; kuitansi<span class="badge" id="bTagihan" hidden></span></a>
        <a href="#kontrak" data-view="kontrak" data-bnav="Kontrak"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6V2Zm8 1.5V8h4.5L14 3.5ZM8.5 12v1.5h7V12h-7Zm0 3v1.5h7V15h-7Zm0 3v1.5h4.5V18H8.5Z"/></svg>Kontrak<span class="badge" id="bKontrak" hidden></span></a>
        <a href="#kondisi" data-view="kondisi"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4V4Zm2 2v12h12V6H6Zm2 6.5 1.4-1.4 1.6 1.6 4.6-4.6L17 9.5l-6 6-3-3Z"/></svg>Kondisi kamar<span class="badge" id="bKondisi" hidden></span></a>
        <a href="#piket" data-view="piket"><svg viewBox="0 0 24 24"><path d="M14.6 2.6 21.4 9.4l-2.1 2.1-1.4-1.4-6.5 6.5 1.4 1.4-2.1 2.1-1.4-1.4L3 23l-2-2 4.3-5.3-1.4-1.4L6 12.2l1.4 1.4 6.5-6.5-1.4-1.4 2.1-2.1Z"/></svg>Piket<span class="badge" id="bPiket" hidden></span></a>
        <a href="#pengumuman" data-view="pengumuman"><svg viewBox="0 0 24 24"><path d="M18 3v14l-6-3H7l1 6H5.5l-1.2-6H4a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h8l6-3Zm2 5.5a3 3 0 0 1 0 5v-5Z"/></svg>Pengumuman<span class="badge" id="bPengumuman" hidden></span></a>
        <a href="#kerusakan" data-view="kerusakan" data-bnav="Lapor"><svg viewBox="0 0 24 24"><path d="M22.7 19 13.6 9.9a6 6 0 0 0-7.9-7.6l3.9 3.9-2.8 2.8-4-3.9A6 6 0 0 0 10.4 13l9.1 9.1a1 1 0 0 0 1.4 0l1.8-1.8a1 1 0 0 0 0-1.3Z"/></svg>Lapor kerusakan</a>
        <a href="#profil" data-view="profil"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5Zm2 2v10h14V7H5Zm2 2h4v4H7V9Zm6 0h4v1.5h-4V9Zm0 3h4v1.5h-4V12Zm-6 3h10v1H7v-1Z"/></svg>Profil &amp; kartu</a>
      </nav>
      <button class="side__logout" id="logout" type="button">Keluar</button>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <dialog class="dlg" id="dlg">
    <form method="dialog" class="dlg__form" id="dlgForm" novalidate>
      <header class="dlg__head"><h2 id="dlgTitle"></h2><button class="icon-btn" value="cancel" formnovalidate aria-label="Tutup">✕</button></header>
      <div class="dlg__body" id="dlgBody"></div>
      <p class="err" id="dlgErr" role="alert" hidden></p>
      <footer class="dlg__foot">
        <button class="btn btn--ghost" value="cancel" formnovalidate>Batal</button>
        <button class="btn btn--red" id="dlgOk" value="ok">Simpan</button>
      </footer>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/js/config.js?v=20261024a"></script>
  <script src="/js/loader.js?v=20261024a"></script>
  <script src="/js/market-ui.js?v=20261024a"></script>
  <script src="/js/dash.js?v=20261024a"></script>
  <script src="/penghuni/penghuni.js?v=20261024m" defer></script>
  <script src="/js/analytics.js?v=20261024a" defer></script>
</body>
</html>
